<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>단상 분전함 & 메거 절연저항 시뮬레이터</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 12px;
    }
    header {
      text-align: center;
      margin-bottom: 12px;
      width: 100%;
      max-width: 500px;
    }
    header h1 { font-size: 1.1rem; color: #38bdf8; margin-bottom: 4px; }
    header p { font-size: 0.8rem; color: #94a3b8; }
    
    .main-container {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    
    .canvas-card {
      background-color: #1e293b;
      border-radius: 12px;
      padding: 6px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
      display: flex;
      justify-content: center;
      align-items: center;
      touch-action: none;
    }
    
    canvas {
      background-color: #111827;
      border-radius: 8px;
      width: 100%;
      height: auto;
      display: block;
    }
    
    .controls {
      display: flex;
      flex-direction: column;
      gap: 8px;
      background-color: #1e293b;
      padding: 12px;
      border-radius: 12px;
    }
    
    .btn-group {
      display: flex;
      gap: 8px;
    }
    
    button {
      flex: 1;
      padding: 12px 6px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    
    .btn-e { background-color: #16a34a; color: white; }
    .btn-e.active { outline: 3px solid #86efac; background-color: #15803d; }
    .btn-l { background-color: #dc2626; color: white; }
    .btn-l.active { outline: 3px solid #fca5a5; background-color: #b91c1c; }
    .btn-reset { background-color: #0284c7; color: white; margin-top: 2px; }
    button:active { transform: scale(0.97); }
    
    .guide-box {
      background-color: rgba(2, 132, 199, 0.1);
      border-left: 4px solid #38bdf8;
      padding: 10px;
      border-radius: 6px;
      font-size: 0.78rem;
      color: #e2e8f0;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <header>
    <h1>⚡ 실전 단상 분전함 & 메거 시뮬레이터</h1>
    <p>손가락 터치/드래그로 리드선을 단자에 연결하세요.</p>
  </header>

  <div class="main-container">
    <div class="canvas-card">
      <canvas id="simCanvas" width="500" height="400"></canvas>
    </div>

    <div class="controls">
      <div class="btn-group">
        <button id="btnSelectE" class="btn-e">E(접지) 리드선 터치선택</button>
        <button id="btnSelectL" class="btn-l">L(라인) 리드선 터치선택</button>
      </div>
      <button id="btnReset" class="btn-reset">새로운 시나리오 (리셋)</button>
    </div>

    <div class="guide-box">
      💡 <b>정상 표준 배선 구조 적용:</b><br>
      메인 2차측(하단) $\rightarrow$ 우회 버스바 $\rightarrow$ 부하 차단기 1차측(상단)으로 깔끔하게 연결되었습니다.
    </div>
  </div>

  <script>
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');

    const btnSelectE = document.getElementById('btnSelectE');
    const btnSelectL = document.getElementById('btnSelectL');
    const btnReset = document.getElementById('btnReset');

    let activeLead = null; 
    let scenario = {};
    let targetTerminals = [];
    
    let probeE = { x: 45, y: 360, target: null };
    let probeL = { x: 95, y: 360, target: null };

    let draggingProbe = null;

    function initScenario() {
      const type = Math.floor(Math.random() * 3);
      scenario = {
        type: type,
        mainON: false,
        b1ON: false,
        b2ON: false,
        rLoad1: type === 1 ? 0.02 : 500,
        rLoad2: type === 2 ? 0.15 : 500
      };

      probeE = { x: 45, y: 360, target: null };
      probeL = { x: 95, y: 360, target: null };
      activeLead = null;
      updateButtonStyles();
      draw();
    }

    function updateButtonStyles() {
      btnSelectE.classList.toggle('active', activeLead === 'E');
      btnSelectL.classList.toggle('active', activeLead === 'L');
    }

    btnSelectE.addEventListener('click', () => {
      activeLead = activeLead === 'E' ? null : 'E';
      updateButtonStyles();
    });

    btnSelectL.addEventListener('click', () => {
      activeLead = activeLead === 'L' ? null : 'L';
      updateButtonStyles();
    });

    btnReset.addEventListener('click', initScenario);

    function setupTerminals() {
      targetTerminals = [
        // Earth Busbar
        { id: 'earth', x: 310, y: 30, radius: 15, type: 'EARTH' },
        
        // Main Breaker Upper (1차측 L, N)
        { id: 'm_in_l', x: 195, y: 75, radius: 10, type: 'MAIN_IN', line: 'L' },
        { id: 'm_in_n', x: 225, y: 75, radius: 10, type: 'MAIN_IN', line: 'N' },
        
        // Main Breaker Lower (2차측)
        { id: 'm_out_l', x: 195, y: 160, radius: 10, type: 'BUS', line: 'L' },
        { id: 'm_out_n', x: 225, y: 160, radius: 10, type: 'BUS', line: 'N' },

        // Branch 1 Upper (1차측) / Lower (2차측 부하선)
        { id: 'b1_in_l', x: 295, y: 95, radius: 10, type: 'BUS', line: 'L' },
        { id: 'b1_in_n', x: 325, y: 95, radius: 10, type: 'BUS', line: 'N' },
        { id: 'b1_out_l', x: 295, y: 160, radius: 10, type: 'LOAD1', line: 'L' },
        { id: 'b1_out_n', x: 325, y: 160, radius: 10, type: 'LOAD1', line: 'N' },

        // Branch 2 Upper (1차측) / Lower (2차측 부하선)
        { id: 'b2_in_l', x: 385, y: 95, radius: 10, type: 'BUS', line: 'L' },
        { id: 'b2_in_n', x: 415, y: 95, radius: 10, type: 'BUS', line: 'N' },
        { id: 'b2_out_l', x: 385, y: 160, radius: 10, type: 'LOAD2', line: 'L' },
        { id: 'b2_out_n', x: 415, y: 160, radius: 10, type: 'LOAD2', line: 'N' }
      ];
    }

    function calculateResistance() {
      if (!probeE.target || !probeL.target) return '---';

      const tE = probeE.target;
      const tL = probeL.target;

      // 1. 동일 접지선
      if (tE.id === 'earth' && tL.id === 'earth') return 0;

      // 2. 대지 절연저항 측정
      if (tE.id === 'earth' || tL.id === 'earth') {
        const activeProbe = (tE.id === 'earth') ? tL : tE;
        let r = 500;

        if (activeProbe.type === 'MAIN_IN') {
          if (scenario.mainON) {
            if (scenario.b1ON) r = Math.min(r, scenario.rLoad1);
            if (scenario.b2ON) r = Math.min(r, scenario.rLoad2);
          }
        } else if (activeProbe.type === 'BUS') {
          if (scenario.b1ON) r = Math.min(r, scenario.rLoad1);
          if (scenario.b2ON) r = Math.min(r, scenario.rLoad2);
        } else if (activeProbe.type === 'LOAD1') {
          r = Math.min(r, scenario.rLoad1);
        } else if (activeProbe.type === 'LOAD2') {
          r = Math.min(r, scenario.rLoad2);
        }

        return r >= 500 ? '> 500' : r.toFixed(2);
      }

      // 3. 같은 단자
      if (tE.id === tL.id) return 0;

      // 4. 선간 측정
      if (tE.type === 'MAIN_IN' && tL.type === 'MAIN_IN') return '> 500';

      return 'ERR';
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 1. 함체
      ctx.strokeStyle = '#475569';
      ctx.lineWidth = 3;
      ctx.strokeRect(150, 10, 330, 230);
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(150, 10, 330, 230);

      // 2. 접지 단자대
      ctx.fillStyle = '#16a34a';
      ctx.fillRect(170, 22, 290, 16);
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 11px sans-serif';
      ctx.fillText('접지 단자대 (EARTH BUSBAR)', 230, 34);

      // 3. 메인 차단기
      ctx.fillStyle = '#334155';
      ctx.fillRect(180, 60, 60, 115);
      ctx.fillStyle = '#f8fafc';
      ctx.font = 'bold 11px sans-serif';
      ctx.fillText('메인', 198, 55);

      ctx.fillStyle = scenario.mainON ? '#22c55e' : '#ef4444';
      ctx.fillRect(195, 105, 30, 26);
      ctx.fillStyle = '#ffffff';
      ctx.fillText(scenario.mainON ? 'ON' : 'OFF', 198, 122);

      // 4. 부하 차단기
      // 부하 1
      ctx.fillStyle = '#334155';
      ctx.fillRect(280, 80, 55, 95);
      ctx.fillStyle = '#f8fafc';
      ctx.font = 'bold 11px sans-serif';
      ctx.fillText('부하1', 292, 73);
      ctx.fillStyle = scenario.b1ON ? '#22c55e' : '#ef4444';
      ctx.fillRect(295, 115, 25, 22);
      ctx.fillStyle = '#ffffff';
      ctx.fillText(scenario.b1ON ? 'ON' : 'OFF', 297, 130);

      // 부하 2
      ctx.fillStyle = '#334155';
      ctx.fillRect(370, 80, 55, 95);
      ctx.fillStyle = '#f8fafc';
      ctx.fillText('부하2', 382, 73);
      ctx.fillStyle = scenario.b2ON ? '#22c55e' : '#ef4444';
      ctx.fillRect(385, 115, 25, 22);
      ctx.fillStyle = '#ffffff';
      ctx.fillText(scenario.b2ON ? 'ON' : 'OFF', 387, 130);

      // 5. 내부 배선 우회 처리 (메인 2차측 -> 차단기 아래 우회 -> 부하 1차측 상단)
      ctx.lineWidth = 3;

      // L선 (빨간색)
      ctx.strokeStyle = '#ef4444';
      ctx.beginPath();
      ctx.moveTo(195, 160);
      ctx.lineTo(195, 195);
      ctx.lineTo(260, 195);
      ctx.lineTo(260, 65);
      ctx.lineTo(385, 65);
      ctx.lineTo(385, 95);
      ctx.moveTo(295, 65);
      ctx.lineTo(295, 95);
      ctx.stroke();

      // N선 (파란색)
      ctx.strokeStyle = '#3b82f6';
      ctx.beginPath();
      ctx.moveTo(225, 160);
      ctx.lineTo(225, 208);
      ctx.lineTo(270, 208);
      ctx.lineTo(270, 55);
      ctx.lineTo(415, 55);
      ctx.lineTo(415, 95);
      ctx.moveTo(325, 55);
      ctx.lineTo(325, 95);
      ctx.stroke();

      // 6. 단자 그리기
      setupTerminals();
      targetTerminals.forEach(t => {
        ctx.beginPath();
        ctx.arc(t.x, t.y, 5, 0, Math.PI * 2);
        ctx.fillStyle = '#f8fafc';
        ctx.fill();
        ctx.strokeStyle = '#0f172a';
        ctx.lineWidth = 1.5;
        ctx.stroke();
      });

      // 7. 계측기
      ctx.fillStyle = '#0284c7';
      ctx.fillRect(15, 260, 120, 125);
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 2;
      ctx.strokeRect(15, 260, 120, 125);

      // 디스플레이
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(25, 270, 100, 36);
      ctx.fillStyle = '#22c55e';
      ctx.font = 'bold 14px monospace';
      const resVal = calculateResistance();
      if (resVal === '---') {
        ctx.fillText('--- MΩ', 45, 293);
      } else if (resVal === 'ERR') {
        ctx.fillStyle = '#ef4444';
        ctx.fillText('CONN ERR', 32, 293);
      } else {
        ctx.fillText(resVal + ' MΩ', 35, 293);
      }

      // 소켓
      ctx.fillStyle = '#16a34a';
      ctx.beginPath(); ctx.arc(35, 325, 8, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#ffffff'; ctx.font = 'bold 10px sans-serif'; ctx.fillText('E', 32, 328);

      ctx.fillStyle = '#dc2626';
      ctx.beginPath(); ctx.arc(115, 325, 8, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#ffffff'; ctx.fillText('L', 112, 328);

      // 측정 리드선
      drawLeadWire(35, 325, probeE.x, probeE.y, '#16a34a');
      drawLeadWire(115, 325, probeL.x, probeL.y, '#dc2626');

      drawProbeTip(probeE.x, probeE.y, '#16a34a', 'E');
      drawProbeTip(probeL.x, probeL.y, '#dc2626', 'L');
    }

    function drawLeadWire(sx, sy, ex, ey, color) {
      ctx.strokeStyle = color;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(sx, sy);
      ctx.bezierCurveTo(sx, sy + 30, ex, ey + 30, ex, ey);
      ctx.stroke();
    }

    function drawProbeTip(x, y, color, label) {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(x, y, 10, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 10px sans-serif';
      ctx.fillText(label, x - 4, y + 3);
    }

    function getCanvasPos(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      return {
        x: (clientX - rect.left) * scaleX,
        y: (clientY - rect.top) * scaleY
      };
    }

    function handleStart(pos) {
      if (pos.x >= 195 && pos.x <= 225 && pos.y >= 105 && pos.y <= 131) {
        scenario.mainON = !scenario.mainON; draw(); return;
      }
      if (pos.x >= 295 && pos.x <= 320 && pos.y >= 115 && pos.y <= 137) {
        scenario.b1ON = !scenario.b1ON; draw(); return;
      }
      if (pos.x >= 385 && pos.x <= 410 && pos.y >= 115 && pos.y <= 137) {
        scenario.b2ON = !scenario.b2ON; draw(); return;
      }

      if (activeLead) {
        const hitTerminal = targetTerminals.find(t => Math.hypot(t.x - pos.x, t.y - pos.y) < 25);
        if (hitTerminal) {
          if (activeLead === 'E') {
            probeE.x = hitTerminal.x; probeE.y = hitTerminal.y; probeE.target = hitTerminal;
          } else {
            probeL.x = hitTerminal.x; probeL.y = hitTerminal.y; probeL.target = hitTerminal;
          }
          activeLead = null;
          updateButtonStyles();
          draw();
          return;
        }
      }

      if (Math.hypot(probeE.x - pos.x, probeE.y - pos.y) < 25) {
        draggingProbe = 'E';
      } else if (Math.hypot(probeL.x - pos.x, probeL.y - pos.y) < 25) {
        draggingProbe = 'L';
      }
    }

    function handleMove(pos) {
      if (!draggingProbe) return;
      if (draggingProbe === 'E') {
        probeE.x = pos.x; probeE.y = pos.y;
      } else if (draggingProbe === 'L') {
        probeL.x = pos.x; probeL.y = pos.y;
      }
      draw();
    }

    function handleEnd() {
      if (!draggingProbe) return;
      const currentProbe = draggingProbe === 'E' ? probeE : probeL;
      const hitTerminal = targetTerminals.find(t => Math.hypot(t.x - currentProbe.x, t.y - currentProbe.y) < 20);

      if (hitTerminal) {
        currentProbe.x = hitTerminal.x;
        currentProbe.y = hitTerminal.y;
        currentProbe.target = hitTerminal;
      } else {
        currentProbe.target = null;
      }

      draggingProbe = null;
      draw();
    }

    canvas.addEventListener('mousedown', (e) => handleStart(getCanvasPos(e)));
    canvas.addEventListener('mousemove', (e) => handleMove(getCanvasPos(e)));
    canvas.addEventListener('mouseup', handleEnd);

    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); handleStart(getCanvasPos(e)); }, { passive: false });
    canvas.addEventListener('touchmove', (e) => { e.preventDefault(); handleMove(getCanvasPos(e)); }, { passive: false });
    canvas.addEventListener('touchend', handleEnd);

    initScenario();
  </script>
</body>
</html>
