<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>분전함 & 메거 절연저항 시뮬레이터</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body { background-color: #0f172a; color: #f8fafc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 10px; }
        .header { text-align: center; margin-bottom: 10px; width: 100%; max-width: 900px; }
        .header h1 { font-size: 1.2rem; color: #38bdf8; margin-bottom: 4px; }
        .header p { font-size: 0.8rem; color: #94a3b8; }
        
        /* 모바일 최적화 메인 컨테이너 */
        .main-container { width: 100%; max-width: 900px; display: flex; flex-direction: column; gap: 10px; }
        
        /* 캔버스 래퍼 (비율 유지 및 스크롤 방지) */
        .canvas-wrapper {
            position: relative;
            width: 100%;
            background: #1e293b;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            overflow: hidden;
            touch-action: none; /* 모바일 드래그 시 화면 스크롤 방지 */
        }
        canvas { display: block; width: 100%; height: auto; aspect-ratio: 900 / 500; }
        
        /* 모바일 터치 가이드 및 조작 패널 */
        .controls { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; background: #1e293b; padding: 10px; border-radius: 8px; }
        .btn { padding: 8px 14px; border: none; border-radius: 6px; font-weight: bold; font-size: 0.85rem; cursor: pointer; transition: all 0.2s; }
        .btn-reset { background: #0284c7; color: white; }
        .btn-reset:active { background: #0369a1; }
        .btn-probe { background: #334155; color: white; border: 1px solid #475569; }
        .btn-probe.active-e { background: #16a34a; border-color: #4ade80; }
        .btn-probe.active-l { background: #dc2626; border-color: #f87171; }
        
        .guide-box { background: #0f172a; border-left: 4px solid #38bdf8; padding: 8px 12px; font-size: 0.78rem; color: #cbd5e1; border-radius: 4px; width: 100%; }
    </style>
</head>
<body>

<div class="header">
    <h1>⚡ 실전 단상 분전함 & 메거 절연저항 시뮬레이터</h1>
    <p>손가락으로 리드선을 끌어다 놓거나, 아래 선택 버튼을 누른 후 단자를 터치하세요.</p>
</div>

<div class="main-container">
    <div class="canvas-wrapper">
        <canvas id="simCanvas" width="900" height="500"></canvas>
    </div>

    <div class="controls">
        <button class="btn btn-probe" id="btnSelectE">E(접지) 리드선 선택</button>
        <button class="btn btn-probe" id="btnSelectL">L(라인) 리드선 선택</button>
        <button class="btn btn-reset" id="btnReset">새로운 시나리오 (리셋)</button>
    </div>

    <div class="guide-box">
        💡 <b>모바일 조작 팁:</b> 드래그가 어려운 경우 <b>[E/L 리드선 선택]</b> 버튼을 누른 뒤, 연결하고 싶은 차단기 단자나 접지 단대(BUSBAR)를 터치하면 바로 연결됩니다.
    </div>
</div>

<script>
const canvas = document.getElementById('simCanvas');
const ctx = canvas.getContext('2d');

// 상태 및 위치 데이터
let activeProbe = null; // 터치 선택 모드용 ('E' 또는 'L')
let selectedTarget = null;

// 모바일 좌표 변환 함수
function getCanvasCoords(e) {
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return {
        x: (clientX - rect.left) * (canvas.width / rect.width),
        y: (clientY - rect.top) * (canvas.height / rect.height)
    };
}

// 터치 & 마우스 공통 포인터 이벤트
let isDragging = null; // 'E' or 'L'

function handleStart(e) {
    const pos = getCanvasCoords(e);
    // E, L 리드선 드래그 감지 로직
    if (Math.hypot(pos.x - probeE.x, pos.y - probeE.y) < 30) isDragging = 'E';
    else if (Math.hypot(pos.x - probeL.x, pos.y - probeL.y) < 30) isDragging = 'L';
    
    if (isDragging) e.preventDefault();
}

function handleMove(e) {
    if (!isDragging) return;
    e.preventDefault();
    const pos = getCanvasCoords(e);
    if (isDragging === 'E') { probeE.x = pos.x; probeE.y = pos.y; }
    if (isDragging === 'L') { probeL.x = pos.x; probeL.y = pos.y; }
    draw();
}

function handleEnd(e) {
    isDragging = null;
    draw();
}

// 기본 위치 설정
let probeE = { x: 120, y: 420 };
let probeL = { x: 220, y: 420 };

// 이벤트 등록 (터치/마우스 모두 지원)
canvas.addEventListener('mousedown', handleStart);
canvas.addEventListener('mousemove', handleMove);
window.addEventListener('mouseup', handleEnd);

canvas.addEventListener('touchstart', handleStart, {passive: false});
canvas.addEventListener('touchmove', handleMove, {passive: false});
canvas.addEventListener('touchend', handleEnd);

// 버튼 클릭 터치 지원
document.getElementById('btnSelectE').addEventListener('click', () => {
    activeProbe = activeProbe === 'E' ? null : 'E';
    updateBtnStyle();
});
document.getElementById('btnSelectL').addEventListener('click', () => {
    activeProbe = activeProbe === 'L' ? null : 'L';
    updateBtnStyle();
});

function updateBtnStyle() {
    document.getElementById('btnSelectE').className = 'btn btn-probe' + (activeProbe === 'E' ? ' active-e' : '');
    document.getElementById('btnSelectL').className = 'btn btn-probe' + (activeProbe === 'L' ? ' active-l' : '');
}

// 렌더링 함수
function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // 분전함 및 메거 그리기
    ctx.fillStyle = "#334155";
    ctx.fillRect(50, 50, 800, 380);
    
    // 접지 단자대 (BUSBAR)
    ctx.fillStyle = "#16a34a";
    ctx.fillRect(300, 80, 500, 20);
    ctx.fillStyle = "#fff";
    ctx.font = "bold 12px sans-serif";
    ctx.fillText("EARTH BUSBAR (접지 단자대)", 470, 95);

    // 메거 계측기
    ctx.fillStyle = "#0284c7";
    ctx.fillRect(80, 120, 180, 220);
    ctx.fillStyle = "#1e293b";
    ctx.fillRect(95, 140, 150, 80);
    ctx.fillStyle = "#4ade80";
    ctx.font = "bold 20px monospace";
    ctx.fillText("500V MEG", 110, 185);

    // 리드선 연결선 그려주기
    ctx.beginPath();
    ctx.moveTo(130, 320); ctx.lineTo(probeE.x, probeE.y);
    ctx.strokeStyle = "#16a34a"; ctx.lineWidth = 5; ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(210, 320); ctx.lineTo(probeL.x, probeL.y);
    ctx.strokeStyle = "#dc2626"; ctx.lineWidth = 5; ctx.stroke();

    // 프로브 헤드
    ctx.beginPath(); ctx.arc(probeE.x, probeE.y, 16, 0, Math.PI*2); ctx.fillStyle = "#16a34a"; ctx.fill();
    ctx.fillStyle = "#fff"; ctx.fillText("E", probeE.x - 5, probeE.y + 5);

    ctx.beginPath(); ctx.arc(probeL.x, probeL.y, 16, 0, Math.PI*2); ctx.fillStyle = "#dc2626"; ctx.fill();
    ctx.fillStyle = "#fff"; ctx.fillText("L", probeL.x - 5, probeL.y + 5);
}

document.getElementById('btnReset').addEventListener('click', () => {
    probeE = { x: 120, y: 420 };
    probeL = { x: 220, y: 420 };
    activeProbe = null;
    updateBtnStyle();
    draw();
});

// 초기화 렌더링
draw();
</script>
</body>
</html>
